<nav class="bg-white shadow-md px-6 py-4 flex justify-between items-center relative">
  <h1 class="text-xl font-bold text-blue-700">GEOFA</h1>

  <!-- Menu desktop -->
  <div class="hidden md:flex space-x-6 text-gray-700 font-medium">
    <a routerLink="/" class="hover:text-blue-600 cursor-pointer">Accueil</a>
    <a routerLink="/a-propos" class="hover:text-blue-600 cursor-pointer">À propos</a>
    <a routerLink="/organisation" class="hover:text-blue-600 cursor-pointer">Organisation</a>
    <a routerLink="/objectifs" class="hover:text-blue-600 cursor-pointer">Objectifs</a>
    <a routerLink="/membres" class="hover:text-blue-600 cursor-pointer">Membres</a>
    <a routerLink="/contact" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 cursor-pointer">
      Rejoindre
    </a>
  </div>

  <!-- Burger menu button (mobile) -->
  <button (click)="toggleMenu()" class="md:hidden flex flex-col justify-center items-center w-10 h-10 focus:outline-none" aria-label="Ouvrir le menu">
    <span class="block w-6 h-0.5 bg-blue-700 mb-1 transition-all duration-300" [ngClass]="{ 'rotate-45 translate-y-2': menuOpen }"></span>
    <span class="block w-6 h-0.5 bg-blue-700 mb-1 transition-all duration-300" [ngClass]="{ 'opacity-0': menuOpen }"></span>
    <span class="block w-6 h-0.5 bg-blue-700 transition-all duration-300" [ngClass]="{ '-rotate-45 -translate-y-2': menuOpen }"></span>
  </button>

  <!-- Menu mobile -->
  <div *ngIf="menuOpen" class="absolute top-full left-0 w-full bg-white shadow-md flex flex-col items-center space-y-4 py-4 z-50 md:hidden animate-fade-in">
    <a routerLink="/" (click)="closeMenu()" class="hover:text-blue-600 cursor-pointer">Accueil</a>
    <a routerLink="/a-propos" (click)="closeMenu()" class="hover:text-blue-600 cursor-pointer">À propos</a>
    <a routerLink="/objectifs" (click)="closeMenu()" class="hover:text-blue-600 cursor-pointer">Objectifs</a>
    <a routerLink="/organisation" (click)="closeMenu()" class="hover:text-blue-600 cursor-pointer">Organisation</a>
    <a routerLink="/membres" (click)="closeMenu()" class="hover:text-blue-600 cursor-pointer">Membres</a>
    <a routerLink="/contact" (click)="closeMenu()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 cursor-pointer">
      Rejoindre
    </a>
  </div>
</nav>
