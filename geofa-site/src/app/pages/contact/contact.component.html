<section class="py-16 px-4 bg-gray-50">
  <h2 class="text-4xl font-bold text-blue-700 text-center mb-8">Contact</h2>

  <div class="max-w-4xl mx-auto grid md:grid-cols-2 gap-12 items-center">
    <!-- Infos de contact -->
    <div class="bg-white rounded-xl shadow p-8 flex flex-col items-center">
      <h3 class="text-2xl font-semibold text-blue-600 mb-4">Nous écrire ou nous rencontrer</h3>
      <div class="text-gray-700 text-lg space-y-2">
        <p><span class="font-semibold">📍 Adresse :</span> Brazzaville, Congo</p>
        <p><span class="font-semibold">✉️ Email :</span> geofaemail.com</p>
        <p><span class="font-semibold">💬 WhatsApp :</span> +242 XXX XXX XXX</p>
      </div>
    </div>

    <!-- Formulaire de contact (non fonctionnel, pour la présentation) -->
    <form class="bg-white rounded-xl shadow p-8 flex flex-col space-y-4">
      <h3 class="text-2xl font-semibold text-blue-600 mb-2 text-center">Formulaire de contact</h3>
      <input type="text" placeholder="Votre nom" class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" required>
      <input type="email" placeholder="Votre email" class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" required>
      <textarea placeholder="Votre message" rows="4" class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" required></textarea>
      <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-700 transition">Envoyer</button>
    </form>
  </div>
</section>
